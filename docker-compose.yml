services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_demo
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  seed:
    build: ./seed-data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SQLITE_PATH: /data/tokyo_anaba.sqlite
    volumes:
      - sqlite-data:/data

  scanner:
    build: ./scanner
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      CATALOG_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SOURCE_POSTGRES_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SOURCE_SQLITE_PATH: /data/tokyo_anaba.sqlite
    volumes:
      - sqlite-data:/data

  api:
    build: ./api
    depends_on:
      scanner:
        condition: service_completed_successfully
    environment:
      CATALOG_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
    ports:
      - "8080:8080"

volumes:
  pgdata:
  sqlite-data:
