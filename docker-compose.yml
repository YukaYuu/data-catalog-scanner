services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_demo
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: dblp_demo
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 (forces a real TCP connection), not -h localhost
      # (which mysqladmin resolves to the Unix socket): MySQL's first-boot
      # sequence briefly runs a temporary, socket-only instance to run its
      # own init scripts, then shuts it down and restarts the real one
      # with networking enabled. A socket-based ping reports "healthy"
      # during that temporary instance, and seed can start connecting via
      # TCP in the gap while the real instance is still coming up --
      # confirmed by hitting exactly this ConnectionRefusedError once.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u catalog -pcatalog"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  seed:
    build: ./seed-data
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SQLITE_PATH: /data/tokyo_anaba.sqlite
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog
      MYSQL_DATABASE: dblp_demo
    volumes:
      - sqlite-data:/data

  scanner:
    build: ./scanner
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      CATALOG_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SOURCE_POSTGRES_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
      SOURCE_SQLITE_PATH: /data/tokyo_anaba.sqlite
      SOURCE_MYSQL_HOST: mysql
      SOURCE_MYSQL_PORT: "3306"
      SOURCE_MYSQL_USER: catalog
      SOURCE_MYSQL_PASSWORD: catalog
      SOURCE_MYSQL_DATABASE: dblp_demo
    volumes:
      - sqlite-data:/data

  api:
    build: ./api
    depends_on:
      scanner:
        condition: service_completed_successfully
    environment:
      CATALOG_DSN: postgresql://catalog:catalog@postgres:5432/catalog_demo
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      # api has no healthcheck (it's a fast-booting Go binary and none of
      # the other services have one either), so this is service_started
      # rather than a real readiness gate -- same tradeoff already made
      # for api's own dependency on scanner completing.
      - api
    environment:
      CATALOG_API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
  sqlite-data:
  mysqldata:
